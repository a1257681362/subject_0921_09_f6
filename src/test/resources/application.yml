spring:
  aop:
    proxy-target-class: true
  datasource:
    url: jdbc:h2:mem:evops-test;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.evops
  configuration:
    map-underscore-to-camel-case: true

# 素材转档测试：产物落在 target，规格与生产一致
asset:
  storage-root: ./target/test-assets
  specs:
    - name: feed_landscape
      usage: 信息流横版
      ratio: "16:9"
      long-edge: 1280
    - name: feed_portrait
      usage: 信息流竖版
      ratio: "9:16"
      long-edge: 1280
  max-file-size: 150KB
  quality:
    initial: 0.85
    floor: 0.5
    decrement: 0.15

# 异常整改线测试：留证照片落在 target；期限收紧到小时级便于测逾期
rectify:
  storage-root: ./target/test-rectify-photos
  sla:
    deadline-hours: 72
    grace-hours: 48
    scan-interval-ms: 3600000
    scan-initial-delay-ms: 3600000

logging:
  level:
    com.evops: WARN
